<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Painel Executivo & Demonstrações Financeiras - Motor Contábil</title>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [data, setData] = useState(null);
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem('tab_ativa') || 'matriz');
      const [periodoAtivo, setPeriodoAtivo] = useState(() => localStorage.getItem('periodo_ativo') || 'anual');
      const [anoAtivo, setAnoAtivo] = useState(() => localStorage.getItem('ano_ativo') || 'todos_anos');
      const [isLoading, setIsLoading] = useState(false);
      const [atualizandoF5, setAtualizandoF5] = useState(false);
      const [notificacaoF5, setNotificacaoF5] = useState('');
      const [busca, setBusca] = useState('');
      const [buscaMatriz, setBuscaMatriz] = useState('');
      const [filtroGrupo, setFiltroGrupo] = useState('todos');
      const [processandoModal, setProcessandoModal] = useState(false);
      const [etapaAtual, setEtapaAtual] = useState(1);
      const [progresso, setProgresso] = useState(15);
      const [nomeArquivoProcessando, setNomeArquivoProcessando] = useState('');
      const [mensagemSucesso, setMensagemSucesso] = useState('');

      // Estados da Janela Modal de Escolha Obrigatória de Trimestre & Validação de Ano
      const [modalPreImportacao, setModalPreImportacao] = useState(false);
      const [arquivoPendente, setArquivoPendente] = useState(null);
      const [anoImportacao, setAnoImportacao] = useState('2026');
      const [novoAnoCustom, setNovoAnoCustom] = useState('');
      const [trimestresImportacao, setTrimestresImportacao] = useState({ '1T': true, '2T': true, '3T': false, '4T': false });
      const [erroValidacaoImportacao, setErroValidacaoImportacao] = useState('');
      
      const [modalMapeamento, setModalMapeamento] = useState(false);
      const [contaDe, setContaDe] = useState('');
      const [grupoPara, setGrupoPara] = useState('vendas_mercadorias');
      const [msgMapeamento, setMsgMapeamento] = useState('');
      const fileInputRef = useRef(null);

      // Estados da Ferramenta de Rabisco / Anotação na Tela (Pincel, Seta, Marcador, Cores, Borracha)
      const [modoRabiscoAtivo, setModoRabiscoAtivo] = useState(false);
      const [ferramentaRabisco, setFerramentaRabisco] = useState('pen'); // 'pen', 'arrow', 'marker', 'rect'
      const [corRabisco, setCorRabisco] = useState('#ef4444'); // Vermelho padrão
      const [espessuraRabisco, setEspessuraRabisco] = useState(3);
      const canvasRef = useRef(null);
      const [desenhando, setDesenhando] = useState(false);
      const [pontoInicial, setPontoInicial] = useState(null);
      const [historicoDesenhos, setHistoricoDesenhos] = useState([]);

      // Novo Fluxo de Governança Corporativa: Portal de Entrada e Hub Enxuto
      // Se não houver seleção prévia na sessão, abre no Portal de Entrada
      const [portalAcessoAberto, setPortalAcessoAberto] = useState(() => {
        return !sessionStorage.getItem('empresa_selecionada_sessao');
      });
      const [empresaSelecionadaPortal, setEmpresaSelecionadaPortal] = useState(() => {
        return sessionStorage.getItem('empresa_selecionada_sessao') || 'CONSOLIDADO';
      });
      const [anoSelecionadoPortal, setAnoSelecionadoPortal] = useState(() => {
        return sessionStorage.getItem('ano_selecionado_sessao') || '2026';
      });
      const [exibirHubEnxuto, setExibirHubEnxuto] = useState(false);

      // Estados de Autenticação e Proteção Zero Trust na Nuvem
      const [exigeAuth, setExigeAuth] = useState(false);
      const [autenticado, setAutenticado] = useState(true);
      const [tokenInput, setTokenInput] = useState('');
      const [erroAuth, setErroAuth] = useState('');
      const [validandoAuth, setValidandoAuth] = useState(false);

      const checarStatusProtecao = async () => {
        try {
          const res = await fetch('/api/auth/status-protecao');
          const json = await res.json();
          if (json.autenticacao_ativa) {
            setExigeAuth(true);
            const tokenSalvo = sessionStorage.getItem('painel_access_token');
            if (!tokenSalvo) {
              setAutenticado(false);
            } else {
              const resVal = await fetch('/api/auth/verificar-acesso', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: tokenSalvo })
              });
              if (!resVal.ok) {
                setAutenticado(false);
              }
            }
          }
        } catch(e) {}
      };

      const realizarLogin = async (e) => {
        if (e) e.preventDefault();
        if (!tokenInput.trim()) return;
        setValidandoAuth(true);
        setErroAuth('');
        try {
          const res = await fetch('/api/auth/verificar-acesso', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: tokenInput.trim() })
          });
          if (res.ok) {
            sessionStorage.setItem('painel_access_token', tokenInput.trim());
            setAutenticado(true);
            carregarDados();
          } else {
            setErroAuth('Chave de Acesso incorreta. Verifique o PIN cadastrado no servidor.');
          }
        } catch(err) {
          setErroAuth('Erro de comunicação com o servidor de autenticação.');
        } finally {
          setValidandoAuth(false);
        }
      };

      // Função de Logout Seguro: Limpa todas as credenciais e estados de sessão
      const handleLogout = () => {
        try {
          sessionStorage.removeItem('painel_access_token');
          sessionStorage.removeItem('empresa_selecionada_sessao');
          sessionStorage.removeItem('ano_selecionado_sessao');
          sessionStorage.removeItem('chat_thread_id');
        } catch(e) {}
        setTokenInput('');
        setAutenticado(false);
        setExigeAuth(true);
        setPortalAcessoAberto(true);
        setExibirHubEnxuto(false);
        setData(null);
      };


      // Salva preferências no localStorage para que ao dar F5 não perca a visualização
      useEffect(() => {
        try { localStorage.setItem('tab_ativa', activeTab); } catch(e){}
      }, [activeTab]);

      useEffect(() => {
        try { localStorage.setItem('periodo_ativo', periodoAtivo); } catch(e){}
      }, [periodoAtivo]);

      useEffect(() => {
        try { localStorage.setItem('ano_ativo', anoAtivo); } catch(e){}
      }, [anoAtivo]);

      const formatarMoeda = (val) => {
        return (val || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const carregarDados = async (ehAtualizacaoF5 = false) => {
        setIsLoading(true);
        if (ehAtualizacaoF5) {
          setAtualizandoF5(true);
          setNotificacaoF5('🔄 Atualizando todos os dados do sistema...');
        }
        try {
          const timestamp = Date.now();
          const tokenSalvo = sessionStorage.getItem('painel_access_token') || '';
          const res = await fetch(`/api/dados-demonstracao-padrao?_t=${timestamp}`, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache',
              'X-Access-Token': tokenSalvo
            }
          });
          if (res.status === 401) {
            setExigeAuth(true);
            setAutenticado(false);
            return;
          }
          const json = await res.json();
          setData(json);
          if (ehAtualizacaoF5) {
            setNotificacaoF5('✅ Sistema e demonstrações atualizados com sucesso via F5!');
            setTimeout(() => setNotificacaoF5(''), 3000);
          }
        } catch (err) {
          console.error(err);
          if (ehAtualizacaoF5) {
            setNotificacaoF5('❌ Erro ao atualizar dados do servidor.');
            setTimeout(() => setNotificacaoF5(''), 3000);
          }
        } finally {
          setIsLoading(false);
          setAtualizandoF5(false);
        }
      };

      useEffect(() => {
        checarStatusProtecao();
        carregarDados();
      }, []);


      // Tecla F5 e recarregamento nativo: Mantemos o comportamento padrão do navegador
      // livre para que o usuário possa recarregar os arquivos do sistema e limpar o cache a qualquer momento.

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [data, activeTab, periodoAtivo, anoAtivo, processandoModal, modalPreImportacao]);

      // Abertura do Modal de Pré-Importação ao escolher arquivo
      const handleSelecionarArquivo = (e) => {
        if (!e.target.files || !e.target.files[0]) return;
        const file = e.target.files[0];
        setArquivoPendente(file);
        setErroValidacaoImportacao('');
        const matchAnoNome = (file.name || '').match(/\b(202[3-9])\b/);
        const anoSugerido = matchAnoNome ? matchAnoNome[1] : ((anoAtivo && anoAtivo !== 'todos_anos') ? anoAtivo : '2026');
        setAnoImportacao(anoSugerido);
        setNovoAnoCustom('');
        
        // Sugestão inteligente baseada no período em foco ou todos se consolidado
        if (periodoAtivo === '1T') {
          setTrimestresImportacao({ '1T': true, '2T': false, '3T': false, '4T': false });
        } else if (periodoAtivo === '2T') {
          setTrimestresImportacao({ '1T': false, '2T': true, '3T': false, '4T': false });
        } else if (periodoAtivo === '3T') {
          setTrimestresImportacao({ '1T': false, '2T': false, '3T': true, '4T': false });
        } else if (periodoAtivo === '4T') {
          setTrimestresImportacao({ '1T': false, '2T': false, '3T': false, '4T': true });
        } else {
          setTrimestresImportacao({ '1T': true, '2T': true, '3T': true, '4T': true });
        }
        setModalPreImportacao(true);
        e.target.value = '';
      };

      // Confirmação com Validação Rigorosa: Se não tiver Plano de Contas / DRE ou esquecer trimestre/ano, NÃO IMPORTA!
      const handleConfirmarImportacao = async () => {
        if (!prontidaoImportacao?.liberado || planoContasLista.length === 0) {
          setErroValidacaoImportacao(
            prontidaoImportacao?.motivo ||
            '🚫 Importação de Dados Restrita: Só é permitido importar movimentações se o Plano de Contas e a estrutura da DRE estiverem cadastrados! Use o botão verde abaixo para cadastrar primeiro a estrutura enxuta desta planilha.'
          );
          return;
        }

        const trimestresAtivos = Object.keys(trimestresImportacao).filter(k => trimestresImportacao[k]);
        
        if (trimestresAtivos.length === 0) {
          setErroValidacaoImportacao('❌ Importação Bloqueada: Você não escolheu nenhum trimestre! Conforme a regra de governança, mesmo que a planilha contenha dados, nada será importado sem a seleção de ao menos um trimestre.');
          return;
        }

        const anoFinal = novoAnoCustom.trim() ? novoAnoCustom.trim() : anoImportacao.trim();
        if (!anoFinal) {
          setErroValidacaoImportacao('❌ Ano Contábil Obrigatório: Não é permitido importar sem definir o ano contábil aberto no cadastro.');
          return;
        }

        setModalPreImportacao(false);
        await executarUpload(arquivoPendente, anoFinal, trimestresAtivos);
      };

      // Execução do Upload com envio estrito de ano e trimestres autorizados
      const executarUpload = async (file, anoDestino, trimestres) => {
        setNomeArquivoProcessando(file.name);
        setProcessandoModal(true);
        setEtapaAtual(1);
        setProgresso(20);
        setIsLoading(true);

        const timer1 = setTimeout(() => { setEtapaAtual(2); setProgresso(50); }, 350);
        const timer2 = setTimeout(() => { setEtapaAtual(3); setProgresso(75); }, 750);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('ano_destino', anoDestino);
        formData.append('trimestres_autorizados', JSON.stringify(trimestres));

        try {
          const tokenSalvo = sessionStorage.getItem('painel_access_token') || '';
          const res = await fetch('/api/upload-demonstracao', {
            method: 'POST',
            headers: { 'X-Access-Token': tokenSalvo },
            body: formData
          });
          const json = await res.json();

          if (!res.ok || json.erro) {
            throw new Error(json.mensagem || json.detalhe || 'Não foi possível ler os dados da planilha. Verifique se o arquivo possui colunas com valores.');
          }

          setEtapaAtual(4);
          setProgresso(100);

          setTimeout(() => {
            setData(json);
            if (json.ano_ativo) {
              setAnoAtivo(json.ano_ativo);
            }
            setActiveTab('matriz');
            setProcessandoModal(false);
            const total = json.total_linhas_lidas || (json.itens_dre?.length || 0) + (json.contas_detalhadas?.length || 0);
            const trimStr = trimestres.join(', ');
            setMensagemSucesso(`✅ Planilha "${file.name}" importada com sucesso para o ano ${anoDestino}! Trimestres autorizados: [${trimStr}]. Demais anos e trimestres preservados.`);
            setTimeout(() => setMensagemSucesso(''), 8000);
          }, 500);

        } catch (err) {
          clearTimeout(timer1);
          clearTimeout(timer2);
          setProcessandoModal(false);
          alert(err.message || 'Erro ao processar o arquivo. Verifique se o formato está legível.');
          console.error(err);
        } finally {
          setIsLoading(false);
        }
      };

      // Limpeza individual ou total de trimestres
      const handleLimparTrimestre = async (trimestre) => {
        const rotulo = trimestre === 'todos' ? 'TODOS os trimestres' : `o ${trimestre}`;
        if (!confirm(`Deseja realmente limpar e zerar os valores d${rotulo}? A Matriz DRE e os consolidados serão recalculados instantaneamente.`)) {
          return;
        }

        setIsLoading(true);
        try {
          const tokenSalvo = sessionStorage.getItem('painel_access_token') || '';
          const res = await fetch('/api/limpar-dados', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Access-Token': tokenSalvo
            },
            body: JSON.stringify({ trimestre: trimestre, ano: anoAtivo })
          });
          const json = await res.json();
          if (json.status === 'sucesso' && json.dados_atualizados) {
            setData(json.dados_atualizados);
            setMensagemSucesso(`🧹 ${json.mensagem}`);
            setTimeout(() => setMensagemSucesso(''), 6000);
          } else {
            alert(json.mensagem || 'Não foi possível limpar os dados.');
          }
        } catch (err) {
          console.error(err);
          alert('Erro ao comunicar com o servidor para limpar dados.');
        } finally {
          setIsLoading(false);
        }
      };

      // Varredura e Expurgo Total do Banco de Dados (Todos os Anos e Trimestres 100% Zerados)
      const handleExpurgarBancoDados = async () => {
        if (!confirm('⚠️ VARREDURA TOTAL DO BANCO DE DADOS:\nDeseja varrer o banco de dados e excluir TODOS os valores de TODOS os anos (2026, 2025, 2024, 2023) e trimestres, deixando 100% zerado?')) {
          return;
        }
        setIsLoading(true);
        try {
          const tokenSalvo = sessionStorage.getItem('painel_access_token') || '';
          const res = await fetch('/api/banco-dados/expurgar-tudo', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Access-Token': tokenSalvo
            }
          });
          const json = await res.json();
          if (json.status === 'sucesso' && json.dados_atualizados) {
            setData(json.dados_atualizados);
            setMensagemSucesso(`🧹 ${json.mensagem}`);
            setTimeout(() => setMensagemSucesso(''), 7000);
          } else {
            alert(json.mensagem || 'Erro ao expurgar banco de dados.');
          }
        } catch (err) {
          console.error(err);
          alert('Erro ao comunicar com o servidor para varrer o banco de dados.');
        } finally {
          setIsLoading(false);
        }
      };

      const [regrasCadastradas, setRegrasCadastradas] = React.useState([]);

      // Estados para Matriz, Filiais e Plano de Contas Multi-Empresas
      const [empresasLista, setEmpresasLista] = React.useState([]);
      const [planoContasLista, setPlanoContasLista] = React.useState([]);
      const [prontidaoImportacao, setProntidaoImportacao] = React.useState({
        liberado: true,
        plano_contas_cadastrado: true,
        dre_cadastrada: true,
        total_contas: 1,
        contas_dre: 1,
        contas_balanco: 0,
        motivo: 'Plano de Contas e estrutura DRE cadastrados e prontos para importação.'
      });
      const [importandoEstrutura, setImportandoEstrutura] = React.useState(false);
      const [resultadoEstrutura, setResultadoEstrutura] = React.useState(null);
      const [tipoPecaEstrutura, setTipoPecaEstrutura] = React.useState('AUTO');
      const [limparAnteriorEstrutura, setLimparAnteriorEstrutura] = React.useState(true);
      const estruturaInputRef = useRef(null);
      const [empresaSelecionadaFiltro, setEmpresaSelecionadaFiltro] = React.useState('CONSOLIDADO');
      const [msgEmpresaPlano, setMsgEmpresaPlano] = React.useState('');

      // Formulário Nova Empresa (Matriz ou Filial)
      const [novaEmpTipo, setNovaEmpTipo] = React.useState('FILIAL');
      const [novaEmpRazao, setNovaEmpRazao] = React.useState('');
      const [novaEmpFantasia, setNovaEmpFantasia] = React.useState('');
      const [novaEmpCnpj, setNovaEmpCnpj] = React.useState('');
      const [novaEmpUf, setNovaEmpUf] = React.useState('SP');
      const [novaEmpCidade, setNovaEmpCidade] = React.useState('');
      const [novaEmpRegime, setNovaEmpRegime] = React.useState('Lucro Real');
      const [novaEmpMatrizId, setNovaEmpMatrizId] = React.useState('emp_matriz_01');

      // Formulário Nova Conta do Plano de Contas Multi-Empresas
      const [novaContaEscopo, setNovaContaEscopo] = React.useState('MATRIZ');
      const [novaContaCodigo, setNovaContaCodigo] = React.useState('');
      const [novaContaNome, setNovaContaNome] = React.useState('');
      const [novaContaDemonstracao, setNovaContaDemonstracao] = React.useState('DRE');
      const [novaContaNatureza, setNovaContaNatureza] = React.useState('CREDORA');
      const [novaContaTipo, setNovaContaTipo] = React.useState('ANALITICA');
      const [novaContaDestinoId, setNovaContaDestinoId] = React.useState('vendas_mercadorias');
      const [novaContaPropagar, setNovaContaPropagar] = React.useState(true);
      const [buscaPlanoContas, setBuscaPlanoContas] = React.useState('');

      // Estados da Máscara do Plano de Contas (#.#.#.##.###) e Cadastro Rápido contínuo via TAB
      const [mascaraPlano, setMascaraPlano] = React.useState('#.#.#.##.###');
      const [modalMascaraAberto, setModalMascaraAberto] = React.useState(false);
      const [mascaraTempInput, setMascaraTempInput] = React.useState('#.#.#.##.###');
      const [gavetaImportacaoAberta, setGavetaImportacaoAberta] = React.useState(false);

      // Linha de Digitação Rápida Contínua (TAB -> TAB -> TAB -> ENTER / Nova Linha Automática)
      const [linhaRapidaConta, setLinhaRapidaConta] = React.useState('');
      const [linhaRapidaReduzido, setLinhaRapidaReduzido] = React.useState('');
      const [linhaRapidaNome, setLinhaRapidaNome] = React.useState('');
      const [linhaRapidaDemonstracao, setLinhaRapidaDemonstracao] = React.useState('DRE');
      const [linhaRapidaDestino, setLinhaRapidaDestino] = React.useState('vendas_mercadorias');
      const [linhaRapidaRef, setLinhaRapidaRef] = React.useState('S');
      const [salvandoLinhaRapida, setSalvandoLinhaRapida] = React.useState(false);

      const refInputConta = React.useRef(null);
      const refInputReduzido = React.useRef(null);
      const refInputNome = React.useRef(null);

      const handleSalvarMascara = async (novaMasc) => {
        const masc = (novaMasc || mascaraTempInput || '#.#.#.##.###').trim();
        setMascaraPlano(masc);
        setModalMascaraAberto(false);
        try {
          const tokenSalvo = sessionStorage.getItem('painel_access_token') || '';
          await fetch('/api/plano-contas/mascara', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Access-Token': tokenSalvo
            },
            body: JSON.stringify({ mascara: masc })
          });
          setMsgEmpresaPlano(`✅ Máscara do Plano de Contas configurada para '${masc}'!`);
          setTimeout(() => setMsgEmpresaPlano(''), 4000);
        } catch (e) {
          console.error(e);
        }
      };

      const handleGravarLinhaRapida = async () => {
        if (!linhaRapidaConta.trim() || !linhaRapidaNome.trim() || salvandoLinhaRapida) return;
        setSalvandoLinhaRapida(true);

        const partesMasc = (mascaraPlano || '#.#.#.##.###').split('.').length;
        const partesConta = linhaRapidaConta.trim().split('.').length;
        const refAuto = linhaRapidaRef || (partesConta >= partesMasc ? 'S' : '');
        const codReduzidoAuto = linhaRapidaReduzido.trim() || String(planoContasLista.length + 1).padStart(6, '0');

        const payload = {
          codigo_contabil: linhaRapidaConta.trim(),
          codigo_reduzido: codReduzidoAuto,
          ref: refAuto,
          nome_conta: linhaRapidaNome.trim(),
          demonstracao: linhaRapidaDemonstracao,

      // Redimensionamento e Ajuste do Canvas de Anotação/Rabisco em TODA a Tela
      useEffect(() => {
        if (!modoRabiscoAtivo) return;
        const cv = canvasRef.current;
        if (!cv) return;

        const ajustarCanvas = () => {
          const w = window.innerWidth;
          const h = window.innerHeight;
          if (cv.width !== w || cv.height !== h) {
            const ctx = cv.getContext('2d');
            const imgData = cv.width > 0 && cv.height > 0 ? ctx.getImageData(0, 0, cv.width, cv.height) : null;
            cv.width = w;
            cv.height = h;
            if (imgData) {
              try { ctx.putImageData(imgData, 0, 0); } catch(e){}
            }
          }
        };

        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);
        return () => window.removeEventListener('resize', ajustarCanvas);
      }, [modoRabiscoAtivo]);

      const extrairCoordenadas = (e) => {
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX, y: clientY };
      };

      const iniciarDesenho = (e) => {
        if (!modoRabiscoAtivo) return;
        const cv = canvasRef.current;
        if (!cv) return;
        const { x, y } = extrairCoordenadas(e);

        const ctx = cv.getContext('2d');
        setDesenhando(true);
        setPontoInicial({ x, y });

        if (ferramentaRabisco === 'pen' || ferramentaRabisco === 'marker') {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.strokeStyle = corRabisco;
          ctx.fillStyle = corRabisco;
          ctx.lineWidth = ferramentaRabisco === 'marker' ? espessuraRabisco * 3.5 : espessuraRabisco;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.globalAlpha = ferramentaRabisco === 'marker' ? 0.35 : 1.0;
        }
      };

      const desenharMovimento = (e) => {
        if (!modoRabiscoAtivo || !desenhando) return;
        const cv = canvasRef.current;
        if (!cv) return;
        const { x, y } = extrairCoordenadas(e);
        const ctx = cv.getContext('2d');

        if (ferramentaRabisco === 'pen' || ferramentaRabisco === 'marker') {
          ctx.lineTo(x, y);
          ctx.stroke();
        }
      };

      const finalizarDesenho = (e) => {
        if (!modoRabiscoAtivo || !desenhando) return;
        const cv = canvasRef.current;
        if (!cv) return;
        const ctx = cv.getContext('2d');
        const posFinal = e.changedTouches ? { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY } : extrairCoordenadas(e);
        const x = posFinal.x;
        const y = posFinal.y;

        if (ferramentaRabisco === 'arrow' && pontoInicial) {
          desenharSeta(ctx, pontoInicial.x, pontoInicial.y, x, y, corRabisco, espessuraRabisco);
        } else if (ferramentaRabisco === 'rect' && pontoInicial) {
          ctx.strokeStyle = corRabisco;
          ctx.lineWidth = espessuraRabisco;
          ctx.globalAlpha = 1.0;
          ctx.strokeRect(pontoInicial.x, pontoInicial.y, x - pontoInicial.x, y - pontoInicial.y);
        } else if (ferramentaRabisco === 'pen' || ferramentaRabisco === 'marker') {
          ctx.closePath();
          ctx.globalAlpha = 1.0;
        }

        setDesenhando(false);
        setPontoInicial(null);
      };

      const desenharSeta = (ctx, fromX, fromY, toX, toY, cor, espessura) => {
        const headlen = Math.max(12, espessura * 4);
        const angle = Math.atan2(toY - fromY, toX - fromX);
        ctx.strokeStyle = cor;
        ctx.fillStyle = cor;
        ctx.lineWidth = espessura;
        ctx.globalAlpha = 1.0;
        ctx.lineCap = 'round';

        // Linha principal da seta
        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.stroke();

        // Cabeça da seta
        ctx.beginPath();
        ctx.moveTo(toX, toY);
        ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
        ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
        ctx.closePath();
        ctx.fill();
      };

      const limparRabiscos = () => {
        const cv = canvasRef.current;
        if (cv) {

      const periodosLista = [
        { id: '1T', rotulo: '1º Trim (1T)', icone: '🌱' },

      // Garante que todos os anos oficiais (2026, 2025, 2024, 2023) NUNCA sumam ao importar qualquer planilha

      const anosDisponiveis = Array.from(

          });

      const parecer = data?.parecer_gestao_jev;
      
      // Matriz DRE estritamente isolada e correspondente ao ano ativo
      const matriz = (anoAtivo !== 'todos_anos' && data?.dre_matriz_por_ano && data.dre_matriz_por_ano[anoAtivo])
        ? data.dre_matriz_por_ano[anoAtivo]
        : data?.dre_matriz_empresa;

      // Balanço Patrimonial isolado por ano (sem fallback contaminante de outro ano)
      let totaisBalancoAno;
      if (anoAtivo === 'todos_anos') {
        const anosLista = data?.anos_disponiveis || [];
        if (anosLista.length > 0 && data?.totais_balanco_por_ano) {
          const somaAtivo = anosLista.reduce((acc, a) => acc + (data.totais_balanco_por_ano[a]?.ativo_total || 0), 0);
          const somaPassivo = anosLista.reduce((acc, a) => acc + (data.totais_balanco_por_ano[a]?.passivo_total || 0), 0);

          totaisBalancoAno = {
            ativo_total: somaAtivo,
            passivo_total: somaPassivo,
            patrimonio_liquido: somaPL
          };
        } else {
          totaisBalancoAno = data?.totais_balanco || { ativo_total: 0, passivo_total: 0, patrimonio_liquido: 0 };
        }
      } else {
        totaisBalancoAno = data?.totais_balanco_por_ano?.[anoAtivo] || {
          ativo_circulante: 0,
          ativo_nao_circulante: 0,
          ativo_total: 0,
          passivo_circulante: 0,
          passivo_nao_circulante: 0,
          patrimonio_liquido: 0,
          passivo_total: 0,
          disponibilidades: 0
        };
      }

      const totaisDreAno = (anoAtivo !== 'todos_anos')
        ? (data?.totais_dre_por_ano?.[anoAtivo] || { receita_bruta: 0, lucro_liquido: 0 })
        : (data?.totais_dre || { receita_bruta: 0, lucro_liquido: 0 });

      const linhaRecBruta = matriz?.linhas?.find(l => l.id === 'rec_bruta');
      const linhaLucroLiq = matriz?.linhas?.find(l => l.id === 'resultado_liquido_exercicio');

      let receitaPeriodo = 0;
      let lucroPeriodo = 0;

      if (anoAtivo === 'todos_anos') {
        const anosLista = data?.anos_disponiveis || [];
        if (anosLista.length > 0 && data?.totais_dre_por_ano) {
          receitaPeriodo = anosLista.reduce((acc, a) => acc + (data.totais_dre_por_ano[a]?.receita_bruta || 0), 0);
          lucroPeriodo = anosLista.reduce((acc, a) => acc + (data.totais_dre_por_ano[a]?.lucro_liquido || 0), 0);
        } else {
          const valoresRec = Object.values(data?.totais_dre_por_ano || {}).map(t => t.receita_bruta || 0);
          receitaPeriodo = valoresRec.length > 0 ? valoresRec.reduce((a, b) => a + b, 0) : (data?.totais_dre?.receita_bruta || 0);

          const valoresLucro = Object.values(data?.totais_dre_por_ano || {}).map(t => t.lucro_liquido || 0);
          lucroPeriodo = valoresLucro.length > 0 ? valoresLucro.reduce((a, b) => a + b, 0) : (data?.totais_dre?.lucro_liquido || 0);
        }
      } else {
        if (linhaRecBruta) {
          if (periodoAtivo === '1T') receitaPeriodo = linhaRecBruta.val_1t || 0;
          else if (periodoAtivo === '2T') receitaPeriodo = linhaRecBruta.val_2t || 0;
          else if (periodoAtivo === '3T') receitaPeriodo = linhaRecBruta.val_3t || 0;
          else if (periodoAtivo === '4T') receitaPeriodo = linhaRecBruta.val_4t || 0;
          else receitaPeriodo = (linhaRecBruta.val_total !== undefined && linhaRecBruta.val_total !== 0) ? linhaRecBruta.val_total : (totaisDreAno?.receita_bruta || 0);
        } else {
          receitaPeriodo = totaisDreAno?.receita_bruta || 0;
        }

        if (linhaLucroLiq) {
          if (periodoAtivo === '1T') lucroPeriodo = linhaLucroLiq.val_1t || 0;
          else if (periodoAtivo === '2T') lucroPeriodo = linhaLucroLiq.val_2t || 0;
          else if (periodoAtivo === '3T') lucroPeriodo = linhaLucroLiq.val_3t || 0;
          else if (periodoAtivo === '4T') lucroPeriodo = linhaLucroLiq.val_4t || 0;
          else lucroPeriodo = (linhaLucroLiq.val_total !== undefined && linhaLucroLiq.val_total !== 0) ? linhaLucroLiq.val_total : (totaisDreAno?.lucro_liquido || 0);
        } else {
          lucroPeriodo = totaisDreAno?.lucro_liquido || 0;
        }
      }

                      type="button"
                      onClick={() => setEspessuraRabisco(esp)}
                      className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                        espessuraRabisco === esp ? 'bg-amber-500 text-slate-950 font-black' : 'bg-slate-800 text-slate-300'
                      }`}
                    >
                      {esp === 2 ? 'Fina' : esp === 4 ? 'Média' : 'Grossa'}
                    </button>
                  ))}
                </div>
              </div>

              {/* Ações: Limpar Tela e Instrução de Print */}
              <div className="pt-2 border-t border-slate-800 flex items-center justify-between gap-2">
                <button
                  type="button"
                  onClick={limparRabiscos}
                  className="px-2.5 py-1.5 rounded-lg bg-rose-600/30 hover:bg-rose-600/50 text-rose-300 border border-rose-500/40 text-[10px] font-bold transition-all flex items-center gap-1"
                  title="Apagar todos os rabiscos da tela"
                >
                  <span>🧹</span>
                  <span>Limpar Tela</span>
                </button>

                <span className="text-[9px] text-slate-400 italic">
                  Rabesque e aperte PrintScreen 📸
                </span>
              </div>
            </div>
          )}

        </div>
      );
    }

    // ----------------------------------------------------------------------------------
    // COMPONENTE: Widget de Chat Executivo Flutuante (LangGraph + Motor Contábil)
    // ----------------------------------------------------------------------------------
    function ChatWidgetExecutivo({ data, anoAtivo, periodoAtivo, modaisAbertos }) {
      const [aberto, setAberto] = useState(false);
      const [mensagens, setMensagens] = useState([
        {
          remetente: 'ia',
          texto: 'Olá! Sou o seu Consultor Financeiro Cognitivo (⚡🧠 LangGraph + Motor Contábil).\n\nPosso analisar a liquidez, margens de rentabilidade (ROE/EBITDA), endividamento ou registrar metas estratégicas para os acionistas. Como posso ajudar hoje?'
        }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [carregando, setCarregando] = useState(false);
      const chatFimRef = useRef(null);

      // Obtém ou gera thread_id único e persistente para a sessão do acionista
      const [threadId] = useState(() => {
        let tid = sessionStorage.getItem('chat_thread_id');
        if (!tid) {
          tid = 'acionista_' + Math.random().toString(36).substring(2, 9);
          sessionStorage.setItem('chat_thread_id', tid);
        }
        return tid;
      });

      useEffect(() => {
        if (aberto && chatFimRef.current) {
          chatFimRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [mensagens, aberto]);

      // Formata negritos de forma elegante em React CDN
      const formatarTextoChat = (texto) => {
        if (!texto) return '';
        const partes = texto.split(/(\*\*.*?\*\*)/g);
        return partes.map((parte, i) => {
          if (parte.startsWith('**') && parte.endsWith('**')) {
            return <strong key={i} className="font-bold text-slate-900">{parte.slice(2, -2)}</strong>;
          }
          return parte;
        });
      };

      const enviarMensagem = async (e) => {
        if (e) e.preventDefault();
        const textoEnvio = inputMsg.trim();
        if (!textoEnvio || carregando) return;

        const novaLista = [...mensagens, { remetente: 'usuario', texto: textoEnvio }];
        setMensagens(novaLista);
        setInputMsg('');
        setCarregando(true);

        try {
          const res = await fetch('/api/chat/agente-financeiro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mensagem: textoEnvio,
              thread_id: threadId,
              ano: (anoAtivo && anoAtivo !== 'todos_anos') ? anoAtivo : (data?.ano_ativo || '2026'),
              trimestre: (periodoAtivo && periodoAtivo !== 'anual') ? periodoAtivo : '1T',
              contexto_financeiro: data || null
            })
          });

          if (res.ok) {
            const respJson = await res.json();
            setMensagens([...novaLista, { remetente: 'ia', texto: respJson.resposta }]);
          } else {
            setMensagens([...novaLista, { remetente: 'ia', texto: '⚠️ Desculpe, ocorreu uma instabilidade momentânea na conexão com o motor cognitivo.' }]);
          }
        } catch (err) {
          setMensagens([...novaLista, { remetente: 'ia', texto: '⚠️ Erro ao se comunicar com o servidor do assistente.' }]);
        } finally {
          setCarregando(false);
        }
      };

      const limparConversa = async () => {
        try {
          await fetch(`/api/chat/sessao/${threadId}`, { method: 'DELETE' });
        } catch (e) {}
        setMensagens([
          {
            remetente: 'ia',
            texto: '🔄 Conversa e contexto reiniciados com sucesso! Como posso auxiliá-lo agora?'
          }
        ]);
      };

      // Respeita recomendação de ergonomia do Goldfish: esconde se modais estiverem abertos
      if (modaisAbertos) return null;

      return (
        <div className="fixed bottom-6 right-6 z-40">
          {!aberto ? (
            <button
              onClick={() => setAberto(true)}
              className="flex items-center gap-2.5 px-4 py-3 bg-slate-900 hover:bg-cyan-700 text-white font-bold text-xs rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 border border-cyan-500/30 group"
              title="Abrir Consultor Financeiro Cognitivo"
            >
              <span className="text-base animate-pulse">⚡🧠</span>
              <span className="tracking-wide">Consultor Financeiro IA</span>
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            </button>
          ) : (
            <div className="w-96 max-w-[92vw] h-[520px] max-h-[85vh] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-in fade-in duration-200">
              {/* Cabeçalho */}
              <div className="bg-slate-900 text-white p-3.5 flex items-center justify-between border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <span className="text-lg">⚡🧠</span>
                  <div>
                    <h3 className="text-xs font-black tracking-wide text-white flex items-center gap-1.5">
                      Consultor Executivo
                      <span className="text-[10px] bg-cyan-900/60 text-cyan-300 px-1.5 py-0.5 rounded font-mono font-bold">LangGraph + JEV</span>
                    </h3>
                    <div className="flex items-center gap-1 text-[10px] text-emerald-400 font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      Memória Ativa ({data?.ano_ativo || '2026'})
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-1">
                  <button
                    onClick={limparConversa}
                    className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition"
                    title="Nova Conversa / Limpar Memória"
                  >
                    <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i>
                  </button>
                  <button
                    onClick={() => setAberto(false)}
                    className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition"
                    title="Minimizar Chat"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              {/* Área de Mensagens */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 text-xs">
                {mensagens.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`flex ${msg.remetente === 'usuario' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div
                      className={`max-w-[88%] p-3 rounded-2xl shadow-sm leading-relaxed whitespace-pre-line ${
                        msg.remetente === 'usuario'
                          ? 'bg-cyan-600 text-white rounded-tr-none'
                          : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none font-normal'
                      }`}
                    >
                      {formatarTextoChat(msg.texto)}
                    </div>
                  </div>
                ))}

                {carregando && (
                  <div className="flex justify-start">
                    <div className="bg-white border border-slate-200 p-2.5 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-2 text-xs text-slate-500">
                      <span className="text-sm animate-spin">⚡</span>
                      <span className="font-semibold text-cyan-800">JEV raciocinando com dados reais...</span>
                    </div>
                  </div>
                )}
                <div ref={chatFimRef} />
              </div>

              {/* Rodapé de Envio */}
              <form onSubmit={enviarMensagem} className="p-2.5 bg-white border-t border-slate-200 flex items-center gap-2">
                <input
                  type="text"
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                  placeholder="Pergunte sobre liquidez, ROE ou grave metas..."
                  className="flex-1 text-xs px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white text-slate-800 transition"
                  disabled={carregando}
                />
                <button
                  type="submit"
                  disabled={carregando || !inputMsg.trim()}
                  className="p-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl shadow-md disabled:opacity-50 disabled:cursor-not-allowed transition"
                  title="Enviar pergunta"
                >
                  <i data-lucide="send" className="w-4 h-4"></i>
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
