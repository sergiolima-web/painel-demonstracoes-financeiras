<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Painel Executivo & Demonstrações Financeiras - JEV Engine</title>
  
  <!-- TailwindCSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0ea5e9',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- React 18 e ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel para JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 selection:bg-cyan-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      const [data, setData] = useState(null);
      const [activeTab, setActiveTab] = useState(() => localStorage.getItem('tab_ativa') || 'matriz');
      const [periodoAtivo, setPeriodoAtivo] = useState(() => localStorage.getItem('periodo_ativo') || 'anual');
      const [anoAtivo, setAnoAtivo] = useState(() => localStorage.getItem('ano_ativo') || 'todos_anos');
      const [isLoading, setIsLoading] = useState(false);
      const [atualizandoF5, setAtualizandoF5] = useState(false);
      const [notificacaoF5, setNotificacaoF5] = useState('');
      const [busca, setBusca] = useState('');
      const [buscaMatriz, setBuscaMatriz] = useState('');
      const [filtroGrupo, setFiltroGrupo] = useState('todos');
      const [processandoModal, setProcessandoModal] = useState(false);
      const [etapaAtual, setEtapaAtual] = useState(1);
      const [progresso, setProgresso] = useState(15);
      const [nomeArquivoProcessando, setNomeArquivoProcessando] = useState('');
      const [mensagemSucesso, setMensagemSucesso] = useState('');

      // Estados da Janela Modal de Escolha Obrigatória de Trimestre & Validação de Ano
      const [modalPreImportacao, setModalPreImportacao] = useState(false);
      const [arquivoPendente, setArquivoPendente] = useState(null);
      const [anoImportacao, setAnoImportacao] = useState('2026');
      const [novoAnoCustom, setNovoAnoCustom] = useState('');
      const [trimestresImportacao, setTrimestresImportacao] = useState({ '1T': true, '2T': true, '3T': false, '4T': false });
      const [erroValidacaoImportacao, setErroValidacaoImportacao] = useState('');
      
      const [modalMapeamento, setModalMapeamento] = useState(false);
      const [contaDe, setContaDe] = useState('');
      const [grupoPara, setGrupoPara] = useState('vendas_mercadorias');
      const [msgMapeamento, setMsgMapeamento] = useState('');
      const fileInputRef = useRef(null);

      // Salva preferências no localStorage para que ao dar F5 não perca a visualização
      useEffect(() => {
        try { localStorage.setItem('tab_ativa', activeTab); } catch(e){}
      }, [activeTab]);

      useEffect(() => {
        try { localStorage.setItem('periodo_ativo', periodoAtivo); } catch(e){}
      }, [periodoAtivo]);

      useEffect(() => {
        try { localStorage.setItem('ano_ativo', anoAtivo); } catch(e){}
      }, [anoAtivo]);

      const formatarMoeda = (val) => {
        return (val || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      };

      const carregarDados = async (ehAtualizacaoF5 = false) => {
        setIsLoading(true);
        if (ehAtualizacaoF5) {
          setAtualizandoF5(true);
          setNotificacaoF5('🔄 Atualizando todos os dados do sistema...');
        }
        try {
          const timestamp = Date.now();
          const res = await fetch(`/api/dados-demonstracao-padrao?_t=${timestamp}`, {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          });
          const json = await res.json();
          setData(json);
          if (ehAtualizacaoF5) {
            setNotificacaoF5('✅ Sistema e demonstrações atualizados com sucesso via F5!');
            setTimeout(() => setNotificacaoF5(''), 3000);
          }
        } catch (err) {
          console.error(err);
          if (ehAtualizacaoF5) {
            setNotificacaoF5('❌ Erro ao atualizar dados do servidor.');
            setTimeout(() => setNotificacaoF5(''), 3000);
          }
        } finally {
          setIsLoading(false);
          setAtualizandoF5(false);
        }
      };

      useEffect(() => {
        carregarDados();
      }, []);

      // Captura da tecla F5 e atalhos de atualização globalmente
      useEffect(() => {
        const capturarTeclasAtualizacao = (e) => {
          if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && (e.key === 'r' || e.key === 'R'))) {
            if (e.shiftKey || (e.ctrlKey && e.key === 'F5')) {
              return;
            }
            e.preventDefault();
            carregarDados(true);
            carregarRegrasDePara();
          }
        };

        window.addEventListener('keydown', capturarTeclasAtualizacao);
        return () => window.removeEventListener('keydown', capturarTeclasAtualizacao);
      }, []);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [data, activeTab, periodoAtivo, anoAtivo, processandoModal, modalPreImportacao]);

      // Abertura do Modal de Pré-Importação ao escolher arquivo
      const handleSelecionarArquivo = (e) => {
        if (!e.target.files || !e.target.files[0]) return;
        const file = e.target.files[0];
        setArquivoPendente(file);
        setErroValidacaoImportacao('');
        const anoSugerido = (anoAtivo && anoAtivo !== 'todos_anos') ? anoAtivo : (data?.anos_disponiveis?.[0] || '2026');
        setAnoImportacao(anoSugerido);
        setNovoAnoCustom('');
        
        // Sugestão inteligente baseada no período em foco ou todos se consolidado
        if (periodoAtivo === '1T') {
          setTrimestresImportacao({ '1T': true, '2T': false, '3T': false, '4T': false });
        } else if (periodoAtivo === '2T') {
          setTrimestresImportacao({ '1T': false, '2T': true, '3T': false, '4T': false });
        } else if (periodoAtivo === '3T') {
          setTrimestresImportacao({ '1T': false, '2T': false, '3T': true, '4T': false });
        } else if (periodoAtivo === '4T') {
          setTrimestresImportacao({ '1T': false, '2T': false, '3T': false, '4T': true });
        } else {
          setTrimestresImportacao({ '1T': true, '2T': true, '3T': true, '4T': true });
        }
        setModalPreImportacao(true);
        e.target.value = '';
      };

      // Confirmação com Validação Rigorosa: Se esquecer trimestre ou não tiver ano, NÃO IMPORTA!
      const handleConfirmarImportacao = async () => {
        const trimestresAtivos = Object.keys(trimestresImportacao).filter(k => trimestresImportacao[k]);
        
        if (trimestresAtivos.length === 0) {
          setErroValidacaoImportacao('❌ Importação Bloqueada: Você não escolheu nenhum trimestre! Conforme a regra de governança, mesmo que a planilha contenha dados, nada será importado sem a seleção de ao menos um trimestre.');
          return;
        }

        const anoFinal = novoAnoCustom.trim() ? novoAnoCustom.trim() : anoImportacao.trim();
        if (!anoFinal) {
          setErroValidacaoImportacao('❌ Ano Contábil Obrigatório: Não é permitido importar sem definir o ano contábil aberto no cadastro.');
          return;
        }

        setModalPreImportacao(false);
        await executarUpload(arquivoPendente, anoFinal, trimestresAtivos);
      };

      // Execução do Upload com envio estrito de ano e trimestres autorizados
      const executarUpload = async (file, anoDestino, trimestres) => {
        setNomeArquivoProcessando(file.name);
        setProcessandoModal(true);
        setEtapaAtual(1);
        setProgresso(20);
        setIsLoading(true);

        const timer1 = setTimeout(() => { setEtapaAtual(2); setProgresso(50); }, 350);
        const timer2 = setTimeout(() => { setEtapaAtual(3); setProgresso(75); }, 750);

        const formData = new FormData();
        formData.append('file', file);
        formData.append('ano_destino', anoDestino);
        formData.append('trimestres_autorizados', JSON.stringify(trimestres));

        try {
          const res = await fetch('/api/upload-demonstracao', {
            method: 'POST',
            body: formData
          });
          const json = await res.json();

          if (!res.ok || json.erro) {
            throw new Error(json.mensagem || json.detalhe || 'Não foi possível ler os dados da planilha. Verifique se o arquivo possui colunas com valores.');
          }

          setEtapaAtual(4);
          setProgresso(100);

          setTimeout(() => {
            setData(json);
            if (json.ano_ativo) {
              setAnoAtivo(json.ano_ativo);
            }
            setActiveTab('matriz');
            setProcessandoModal(false);
            const total = json.total_linhas_lidas || (json.itens_dre?.length || 0) + (json.contas_detalhadas?.length || 0);
            const trimStr = trimestres.join(', ');
            setMensagemSucesso(`✅ Planilha "${file.name}" importada com sucesso para o ano ${anoDestino}! Trimestres autorizados: [${trimStr}]. Demais trimestres mantidos zerados.`);
            setTimeout(() => setMensagemSucesso(''), 8000);
          }, 500);

        } catch (err) {
          clearTimeout(timer1);
          clearTimeout(timer2);
          setProcessandoModal(false);
          alert(err.message || 'Erro ao processar o arquivo. Verifique se o formato está legível.');
          console.error(err);
        } finally {
          setIsLoading(false);
        }
      };

      // Limpeza individual ou total de trimestres
      const handleLimparTrimestre = async (trimestre) => {
        const rotulo = trimestre === 'todos' ? 'TODOS os trimestres' : `o ${trimestre}`;
        if (!confirm(`Deseja realmente limpar e zerar os valores d${rotulo}? A Matriz DRE e os consolidados serão recalculados instantaneamente.`)) {
          return;
        }

        setIsLoading(true);
        try {
          const res = await fetch('/api/limpar-dados', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ trimestre: trimestre, ano: anoAtivo })
          });
          const json = await res.json();
          if (json.status === 'sucesso' && json.dados_atualizados) {
            setData(json.dados_atualizados);
            setMensagemSucesso(`🧹 ${json.mensagem}`);
            setTimeout(() => setMensagemSucesso(''), 6000);
          } else {
            alert(json.mensagem || 'Não foi possível limpar os dados.');
          }
        } catch (err) {
          console.error(err);
          alert('Erro ao comunicar com o servidor para limpar dados.');
        } finally {
          setIsLoading(false);
        }
      };

      const [regrasCadastradas, setRegrasCadastradas] = React.useState([]);

      const carregarRegrasDePara = async () => {
        try {
          const res = await fetch('/api/regras-depara');
          const json = await res.json();
          if (json.regras) setRegrasCadastradas(json.regras);
        } catch (e) {
          console.error("Erro ao carregar regras de-para", e);
        }
      };

      React.useEffect(() => {
        carregarRegrasDePara();
      }, []);

      const handleSalvarMapeamento = async (e) => {
        e.preventDefault();
        if (!contaDe.trim()) return;
        
        try {
          const res = await fetch('/api/regras-depara', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              termo_origem: contaDe.trim(),
              conta_matriz_id: grupoPara,
              conta_matriz_nome: grupoPara,
              observacao: 'Particularidade cadastrada pelo usuário no painel'
            })
          });
          const resJson = await res.json();
          if (resJson.status === 'sucesso') {
            setMsgMapeamento(`✅ Sucesso! JEV memorizou que "${contaDe}" conglutina na conta de destino.`);
            carregarRegrasDePara();
            setTimeout(() => {
              setMsgMapeamento('');
              setContaDe('');
            }, 2500);
          }
        } catch (err) {
          setMsgMapeamento('❌ Erro ao salvar regra no servidor.');
        }
      };

      const handleExcluirRegra = async (regraId) => {
        try {
          await fetch(`/api/regras-depara/${regraId}`, { method: 'DELETE' });
          carregarRegrasDePara();
        } catch (e) {
          console.error(e);
        }
      };

      const periodosLista = [
        { id: '1T', rotulo: '1º Trim (1T)', icone: '🌱' },
        { id: '2T', rotulo: '2º Trim (2T)', icone: '📈' },
        { id: '3T', rotulo: '3º Trim (3T)', icone: '⚡' },
        { id: '4T', rotulo: '4º Trim (4T)', icone: '🎯' },
        { id: 'anual', rotulo: 'Consolidado Anual', icone: '🏛️' },
      ];

      const anosDisponiveis = data?.anos_disponiveis || ['2026', '2025'];

      // Indicadores Financeiros isolados por ano
      const indicesBaseAno = (anoAtivo !== 'todos_anos' && data?.indicadores_por_ano?.[anoAtivo])
        ? data.indicadores_por_ano[anoAtivo]
        : (data?.indices_financeiros || {
            liquidez: { liquidez_corrente: 0, liquidez_seca: 0, liquidez_imediata: 0, liquidez_geral: 0 },
            rentabilidade: { roe_pct: 0, roa_pct: 0, margem_ebitda_pct: 0, margem_bruta_pct: 0, margem_liquida_pct: 0 },
            endividamento: { endividamento_geral_pct: 0, composicao_divida_curto_prazo_pct: 0, imobilizacao_pl_pct: 0 }
          });

      const parecer = data?.parecer_gestao_jev;
      
      // Matriz DRE estritamente isolada e correspondente ao ano ativo
      const matriz = (anoAtivo !== 'todos_anos' && data?.dre_matriz_por_ano && data.dre_matriz_por_ano[anoAtivo])
        ? data.dre_matriz_por_ano[anoAtivo]
        : data?.dre_matriz_empresa;

      // Balanço Patrimonial isolado por ano (sem fallback contaminante de outro ano)
      const totaisBalancoAno = (anoAtivo !== 'todos_anos')
        ? (data?.totais_balanco_por_ano?.[anoAtivo] || {
            ativo_circulante: 0,
            ativo_nao_circulante: 0,
            ativo_total: 0,
            passivo_circulante: 0,
            passivo_nao_circulante: 0,
            patrimonio_liquido: 0,
            passivo_total: 0,
            disponibilidades: 0
          })
        : (data?.totais_balanco || {
            ativo_circulante: 0,
            ativo_nao_circulante: 0,
            ativo_total: 0,
            passivo_circulante: 0,
            passivo_nao_circulante: 0,
            patrimonio_liquido: 0,
            passivo_total: 0,
            disponibilidades: 0
          });

      const totaisDreAno = (anoAtivo !== 'todos_anos')
        ? (data?.totais_dre_por_ano?.[anoAtivo] || { receita_bruta: 0, lucro_liquido: 0 })
        : (data?.totais_dre || { receita_bruta: 0, lucro_liquido: 0 });

      const linhaRecBruta = matriz?.linhas?.find(l => l.id === 'rec_bruta');
      const linhaLucroLiq = matriz?.linhas?.find(l => l.id === 'resultado_liquido_exercicio');

      let receitaPeriodo = 0;
      let lucroPeriodo = 0;

      if (anoAtivo === 'todos_anos') {
        const valoresRec = Object.values(data?.totais_dre_por_ano || {}).map(t => t.receita_bruta || 0);
        receitaPeriodo = valoresRec.length > 0 ? valoresRec.reduce((a, b) => a + b, 0) : (data?.totais_dre?.receita_bruta || 0);

        const valoresLucro = Object.values(data?.totais_dre_por_ano || {}).map(t => t.lucro_liquido || 0);
        lucroPeriodo = valoresLucro.length > 0 ? valoresLucro.reduce((a, b) => a + b, 0) : (data?.totais_dre?.lucro_liquido || 0);
      } else {
        if (linhaRecBruta) {
          if (periodoAtivo === '1T') receitaPeriodo = linhaRecBruta.val_1t || 0;
          else if (periodoAtivo === '2T') receitaPeriodo = linhaRecBruta.val_2t || 0;
          else if (periodoAtivo === '3T') receitaPeriodo = linhaRecBruta.val_3t || 0;
          else if (periodoAtivo === '4T') receitaPeriodo = linhaRecBruta.val_4t || 0;
          else receitaPeriodo = (linhaRecBruta.val_total !== undefined && linhaRecBruta.val_total !== 0) ? linhaRecBruta.val_total : (totaisDreAno?.receita_bruta || 0);
        } else {
          receitaPeriodo = totaisDreAno?.receita_bruta || 0;
        }

        if (linhaLucroLiq) {
          if (periodoAtivo === '1T') lucroPeriodo = linhaLucroLiq.val_1t || 0;
          else if (periodoAtivo === '2T') lucroPeriodo = linhaLucroLiq.val_2t || 0;
          else if (periodoAtivo === '3T') lucroPeriodo = linhaLucroLiq.val_3t || 0;
          else if (periodoAtivo === '4T') lucroPeriodo = linhaLucroLiq.val_4t || 0;
          else lucroPeriodo = (linhaLucroLiq.val_total !== undefined && linhaLucroLiq.val_total !== 0) ? linhaLucroLiq.val_total : (totaisDreAno?.lucro_liquido || 0);
        } else {
          lucroPeriodo = totaisDreAno?.lucro_liquido || 0;
        }
      }

      const ativoTotal = totaisBalancoAno?.ativo_total || 0;
      const passivoTotal = (totaisBalancoAno?.passivo_total !== undefined && totaisBalancoAno?.passivo_total !== null && totaisBalancoAno?.passivo_total !== 0)
        ? totaisBalancoAno.passivo_total
        : ((totaisBalancoAno?.passivo_circulante || 0) + (totaisBalancoAno?.passivo_nao_circulante || 0));
      const plTotal = totaisBalancoAno?.patrimonio_liquido || 0;

      const indExibicao = indicesBaseAno;

      const contasFiltradas = (data?.contas_detalhadas || []).filter(c => {
        const matchTexto = c.conta.toLowerCase().includes(busca.toLowerCase()) || c.codigo.includes(busca);
        const matchGrupo = filtroGrupo === 'todos' || c.grupo.includes(filtroGrupo);
        return matchTexto && matchGrupo;
      });

      const linhasMatrizFiltradas = (matriz?.linhas || []).filter(l => {
        if (!buscaMatriz) return true;
        return l.conta.toLowerCase().includes(buscaMatriz.toLowerCase());
      });

      const gruposUnicos = Array.from(new Set((data?.contas_detalhadas || []).map(c => c.grupo)));

      const getEstiloLinhaMatriz = (linha) => {
        const estilo = linha.estilo || '';
        const conta = (linha.conta || '').toUpperCase();

        if (estilo === 'destaque_ouro_neon' || conta.includes('RESULTADO LÍQUIDO DO EXERCÍCIO')) {
          return 'bg-amber-300 text-slate-950 font-black border-y-2 border-amber-400 shadow-sm';
        }
        if (estilo === 'destaque_laranja' || conta.includes('RECEITA OPERACIONAL BRUTA')) {
          return 'bg-amber-100 text-amber-950 font-extrabold border-y border-amber-300';
        }
        if (estilo === 'destaque_amarelo' || conta.includes('DEDUÇÕES') || conta.includes('RESULTADO OPERACIONAL BRUTO') || conta.includes('LUCRO OPERACIONAL LÍQUIDO') || conta.includes('RESULTADO OPERACIONAL ANTES')) {
          return 'bg-yellow-100 text-yellow-950 font-bold border-y border-yellow-300';
        }
        if (estilo === 'destaque_verde_menta' || conta.includes('RECEITA OPERACIONAL LÍQUIDA') || conta.includes('OUTRAS RECEITAS') || conta.includes('PROVISÃO IRPJ')) {
          return 'bg-emerald-100 text-emerald-950 font-bold border-y border-emerald-300';
        }
        if (estilo === 'destaque_verde' || conta.includes('CUSTO OPERACIONAL BRUTO')) {
          return 'bg-teal-100 text-teal-950 font-bold border-y border-teal-300';
        }
        if (estilo === 'destaque_cinza' || conta.includes('DESPESAS OPERACIONAIS E ADMINIST') || conta.includes('RESULTADO NÃO OPERACIONAL')) {
          return 'bg-slate-200 text-slate-900 font-bold border-y border-slate-300';
        }
        if (linha.tipo === 'grupo') {
          return 'bg-slate-100 text-slate-900 font-bold border-y border-slate-200';
        }
        return 'hover:bg-amber-50/60 text-slate-800';
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans">
          
          {/* Header Superior */}
          <header className="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50 shadow-sm w-full">
            <div className="w-full px-4 sm:px-6 lg:px-8">
              
              <div className="h-16 flex items-center justify-between gap-4">
                {/* Lado Esquerdo: Branding e Identidade */}
                <div className="flex items-center space-x-3 min-w-0">
                  <div className="h-10 w-10 shrink-0 rounded-xl bg-gradient-to-tr from-amber-500 via-yellow-500 to-amber-600 flex items-center justify-center text-slate-950 font-bold text-xl shadow-md shadow-amber-500/20">
                    🏢
                  </div>
                  <div className="min-w-0">
                    <div className="flex items-center gap-2 flex-wrap sm:flex-nowrap">
                      <h1 className="text-base sm:text-lg font-bold text-slate-900 tracking-tight truncate">
                        Painel Executivo & Matriz DRE
                      </h1>
                      <span className="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-50 border border-emerald-200 text-[11px] font-semibold text-emerald-800 shrink-0">
                        <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        JEV Engine Ativo
                      </span>
                    </div>
                    <p className="text-xs text-slate-500 truncate hidden sm:block mt-0.5">
                      Estrutura Corporativa Oficial & Demonstrações Financeiras
                    </p>
                  </div>
                </div>

                {/* Lado Direito: Ações e Atalhos Organizados */}
                <div className="flex items-center gap-2 shrink-0">
                  {/* Atalho Módulo de Ensino JEV */}
                  <button

    // ----------------------------------------------------------------------------------
    // COMPONENTE: Widget de Chat Executivo Flutuante (LangGraph + JEV Engine)
    // ----------------------------------------------------------------------------------
    function ChatWidgetExecutivo({ data, anoAtivo, periodoAtivo, modaisAbertos }) {
      const [aberto, setAberto] = useState(false);
      const [mensagens, setMensagens] = useState([
        {
          remetente: 'ia',
          texto: 'Olá! Sou o seu Consultor Financeiro Cognitivo (⚡🧠 LangGraph + JEV Engine).\n\nPosso analisar a liquidez, margens de rentabilidade (ROE/EBITDA), endividamento ou registrar metas estratégicas para os acionistas. Como posso ajudar hoje?'
        }
      ]);
      const [inputMsg, setInputMsg] = useState('');
      const [carregando, setCarregando] = useState(false);
      const chatFimRef = useRef(null);

      // Obtém ou gera thread_id único e persistente para a sessão do acionista
      const [threadId] = useState(() => {
        let tid = sessionStorage.getItem('chat_thread_id');
        if (!tid) {
          tid = 'acionista_' + Math.random().toString(36).substring(2, 9);
          sessionStorage.setItem('chat_thread_id', tid);
        }
        return tid;
      });

      useEffect(() => {
        if (aberto && chatFimRef.current) {
          chatFimRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [mensagens, aberto]);

      // Formata negritos de forma elegante em React CDN
      const formatarTextoChat = (texto) => {
        if (!texto) return '';
        const partes = texto.split(/(\*\*.*?\*\*)/g);
        return partes.map((parte, i) => {
          if (parte.startsWith('**') && parte.endsWith('**')) {
            return <strong key={i} className="font-bold text-slate-900">{parte.slice(2, -2)}</strong>;
          }
          return parte;
        });
      };

      const enviarMensagem = async (e) => {
        if (e) e.preventDefault();
        const textoEnvio = inputMsg.trim();
        if (!textoEnvio || carregando) return;

        const novaLista = [...mensagens, { remetente: 'usuario', texto: textoEnvio }];
        setMensagens(novaLista);
        setInputMsg('');
        setCarregando(true);

        try {
          const res = await fetch('/api/chat/agente-financeiro', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              mensagem: textoEnvio,
              thread_id: threadId,
              ano: (anoAtivo && anoAtivo !== 'todos_anos') ? anoAtivo : (data?.ano_ativo || '2026'),
              trimestre: (periodoAtivo && periodoAtivo !== 'anual') ? periodoAtivo : '1T',
              contexto_financeiro: data || null
            })
          });

          if (res.ok) {
            const respJson = await res.json();
            setMensagens([...novaLista, { remetente: 'ia', texto: respJson.resposta }]);
          } else {
            setMensagens([...novaLista, { remetente: 'ia', texto: '⚠️ Desculpe, ocorreu uma instabilidade momentânea na conexão com o motor cognitivo.' }]);
          }
        } catch (err) {
          setMensagens([...novaLista, { remetente: 'ia', texto: '⚠️ Erro ao se comunicar com o servidor do assistente.' }]);
        } finally {
          setCarregando(false);
        }
      };

      const limparConversa = async () => {
        try {
          await fetch(`/api/chat/sessao/${threadId}`, { method: 'DELETE' });
        } catch (e) {}
        setMensagens([
          {
            remetente: 'ia',
            texto: '🔄 Conversa e contexto reiniciados com sucesso! Como posso auxiliá-lo agora?'
          }
        ]);
      };

      // Respeita recomendação de ergonomia do Goldfish: esconde se modais estiverem abertos
      if (modaisAbertos) return null;

      return (
        <div className="fixed bottom-6 right-6 z-40">
          {!aberto ? (
            <button
              onClick={() => setAberto(true)}
              className="flex items-center gap-2.5 px-4 py-3 bg-slate-900 hover:bg-cyan-700 text-white font-bold text-xs rounded-full shadow-2xl transition-all duration-300 transform hover:scale-105 border border-cyan-500/30 group"
              title="Abrir Consultor Financeiro Cognitivo"
            >
              <span className="text-base animate-pulse">⚡🧠</span>
              <span className="tracking-wide">Consultor Financeiro IA</span>
              <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            </button>
          ) : (
            <div className="w-96 max-w-[92vw] h-[520px] max-h-[85vh] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-in fade-in duration-200">
              {/* Cabeçalho */}
              <div className="bg-slate-900 text-white p-3.5 flex items-center justify-between border-b border-slate-800">
                <div className="flex items-center gap-2">
                  <span className="text-lg">⚡🧠</span>
                  <div>
                    <h3 className="text-xs font-black tracking-wide text-white flex items-center gap-1.5">
                      Consultor Executivo
                      <span className="text-[10px] bg-cyan-900/60 text-cyan-300 px-1.5 py-0.5 rounded font-mono font-bold">LangGraph + JEV</span>
                    </h3>
                    <div className="flex items-center gap-1 text-[10px] text-emerald-400 font-medium">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      Memória Ativa ({data?.ano_ativo || '2026'})
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-1">
                  <button
                    onClick={limparConversa}
                    className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition"
                    title="Nova Conversa / Limpar Memória"
                  >
                    <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i>
                  </button>
                  <button
                    onClick={() => setAberto(false)}
                    className="p-1.5 text-slate-400 hover:text-white rounded-lg hover:bg-slate-800 transition"
                    title="Minimizar Chat"
                  >
                    <i data-lucide="x" className="w-4 h-4"></i>
                  </button>
                </div>
              </div>

              {/* Área de Mensagens */}
              <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50 text-xs">
                {mensagens.map((msg, idx) => (
                  <div
                    key={idx}
                    className={`flex ${msg.remetente === 'usuario' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div
                      className={`max-w-[88%] p-3 rounded-2xl shadow-sm leading-relaxed whitespace-pre-line ${
                        msg.remetente === 'usuario'
                          ? 'bg-cyan-600 text-white rounded-tr-none'
                          : 'bg-white text-slate-800 border border-slate-200 rounded-tl-none font-normal'
                      }`}
                    >
                      {formatarTextoChat(msg.texto)}
                    </div>
                  </div>
                ))}

                {carregando && (
                  <div className="flex justify-start">
                    <div className="bg-white border border-slate-200 p-2.5 rounded-2xl rounded-tl-none shadow-sm flex items-center gap-2 text-xs text-slate-500">
                      <span className="text-sm animate-spin">⚡</span>
                      <span className="font-semibold text-cyan-800">JEV raciocinando com dados reais...</span>
                    </div>
                  </div>
                )}
                <div ref={chatFimRef} />
              </div>

              {/* Rodapé de Envio */}
              <form onSubmit={enviarMensagem} className="p-2.5 bg-white border-t border-slate-200 flex items-center gap-2">
                <input
                  type="text"
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                  placeholder="Pergunte sobre liquidez, ROE ou grave metas..."
                  className="flex-1 text-xs px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 focus:bg-white text-slate-800 transition"
                  disabled={carregando}
                />
                <button
                  type="submit"
                  disabled={carregando || !inputMsg.trim()}
                  className="p-2 bg-cyan-600 hover:bg-cyan-700 text-white rounded-xl shadow-md disabled:opacity-50 disabled:cursor-not-allowed transition"
                  title="Enviar pergunta"
                >
                  <i data-lucide="send" className="w-4 h-4"></i>
                </button>
              </form>
            </div>
          )}
        </div>
      );
    }


    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
